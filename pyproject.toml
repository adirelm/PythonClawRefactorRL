[project]
name = "pythonclawrl"
version = "1.2.0"
description = "Bar-Ilan Vibe-Coding & RL Workshop — Assignment 4 (PPO+GAE on PythonClaw Skills graph)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Solo developer (architect role per CLAUDE.md §1.4)"}]
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "networkx>=3.2",
    "stable-baselines3>=2.3",
    "tiktoken>=0.7",
    "radon>=6.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "scipy>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "ipykernel>=6.29",
    "pyvis>=0.3",
    "nbclient>=0.11.0",
    "nbformat>=5.10.4",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PL", "RUF"]
ignore = ["E501"]    # line-length is handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "RUF002"]   # magic numbers + unicode in test docstrings are fine

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "slow: long-running ablation / paired-seed sweeps (opt-in)",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/test_*", "src/__init__.py", "*/__init__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if __name__ == .__main__.:"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
