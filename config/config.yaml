version: "1.2.0"

ppo:
  clip_eps: 0.2  # FIXED by ex04 §2.3 — do not tune; asserted in test_ppo_constants.py
  n_steps: 128
  batch_size: 64
  n_epochs: 4
  learning_rate: 3.0e-4
  vf_coef: 0.5
  ent_coef: 0.01
  max_grad_norm: 0.5

gae:
  lambda: 0.95  # FIXED by ex04 §2.3 — do not tune
  gamma: 0.99

reward:
  alpha: 1.0  # ΔModularity weight
  beta: 1.0   # ΔCohesion weight
  gamma: 0.5  # Coupling penalty weight
  p_skills: -5.0  # lazy-load-break penalty (BIG NEGATIVE)

centrality:
  betweenness_calls_per_seed: 3  # start + end + final-eval; asserted in test_centrality_discipline.py

action:
  # A_max arithmetic (ACTION_DESIGN §1):
  # V_max=512, K=8, M=16, E_max=4096, R=8
  # A_split  = 512 × 8  = 4096
  # A_merge  = 512 × 16 = 8192
  # A_rewire = 4096 × 8 = 32768
  # A_noop   = 1
  # A_max    = 4096 + 8192 + 32768 + 1 = 45057
  a_max_total: 45057

seeds: [42, 7, 123, 314, 271]  # ≥5 for statistical claims

training:
  max_episodes: 500
  convergence:
    rolling_window: 100
    reward_drift_pct: 2.0
    consecutive_episodes: 50
    entropy_threshold: 0.5

environment:
  max_nodes_v: 512  # padding cap for variable-|V| handling

paths:
  vault_dir: "results/vault/"
  figures_dir: "results/figures/"
  ablation_dir: "results/ablation/"
