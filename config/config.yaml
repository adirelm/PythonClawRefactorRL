version: "1.3.0"

ppo:
  clip_eps: 0.2  # FIXED by ex04 §2.3 — do not tune; asserted in test_config_loader.py::test_clip_eps_is_exactly_0_2 + test_ppo_trainer.py::test_trainer_uses_canonical_clip_eps_0_2
  n_steps: 128
  batch_size: 64
  n_epochs: 4
  learning_rate: 3.0e-4
  vf_coef: 0.5
  ent_coef: 0.01
  max_grad_norm: 0.5
  gae_lambda: 0.95  # FIXED by ex04 §2.3 — do not tune (PRD-GAE FR-4; SB3 idiom)
  gamma: 0.99  # GAE discount factor (PRD-GAE FR-5; SB3 idiom)

reward:
  alpha: 1.0  # ΔModularity weight
  beta: 1.0   # ΔCohesion weight
  gamma: 0.5  # Coupling penalty weight
  p_skills: -5.0  # lazy-load-break penalty (BIG NEGATIVE)

centrality:
  betweenness_calls_per_seed: 2  # start + end ONLY (brief §2.2; ADR-006); enforced by tests/architecture/test_betweenness_call_count.py

state:
  feature_dim: 16  # X ∈ ℝ^{|V|×16}; columns documented in docs/STATE_DESIGN.md §2
  relation_weights:
    call: 1.0
    import: 0.5
    inheritance: 0.7
  normalization:
    loc_log1p: true  # log1p normalize LOC
    cyclomatic_clip: 50  # clip cyclomatic above 50

action:
  a_max_total: 45057  # = 4096 + 8192 + 32768 + 1 per docs/ACTION_DESIGN.md §1
  split_choices_k: 8
  merge_topm: 16
  rewire_topr: 8

seeds: [42, 7, 123, 314, 271]  # ≥5 for statistical claims

training:
  max_episodes: 500

convergence:
  window_length: 100  # episodes per non-overlapping window (ADR-010)
  step: 100  # non-overlapping; Window A = [t-200:t-100], Window B = [t-100:t]
  reward_rel_tol: 0.02  # |mean(B)-mean(A)|/|mean(A)| ≤ 0.02
  entropy_slope_threshold: 0.01  # |dH/dt| over 100-episode window (nats/episode); replaces absolute floor (PRD-PPO F4.9 c2=0.0 makes floor trivial)

environment:
  max_nodes_v: 512  # FALLBACK ONLY — ADR-008-gated; primary path is variable-|V| via PyG DataLoader per ADR-004; used only if SB3 RolloutBuffer cannot handle Dict obs

paths:
  vault_dir: "results/vault/"
  figures_dir: "results/figures/"
  ablation_dir: "results/ablation/"

ablation:
  # COMPACT grid: 3 values per knob, 5 seeds/cell, 256 steps/seed.
  # Smoke runs in ~80 min wall-clock on M-series after RC-4 (SIGALRM Louvain cut).
  grids:
    compact:
      alpha:    [0.5, 1.0, 2.0]
      beta:     [0.5, 1.0, 2.0]
      gamma:    [0.0, 0.5, 1.0]
      p_skills: [-10.0, -5.0, -1.0]
    smoke:
      alpha:    [1.0]
      beta:     [1.0]
      gamma:    [0.5]
      p_skills: [-5.0]
  scout_seeds: [42, 7, 123, 314, 271]  # all 5 sealed seeds (RC-4 closed the 123/314 hang)
  total_steps_per_cell_seed: 256
  per_seed_timeout_s: 240
  cell_timeout_s: 1500          # 5 seeds × 240s + slack
